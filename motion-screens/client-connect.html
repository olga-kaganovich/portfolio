<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet"><style>
    :root {
      --paper: #f3f1ed;
      --ink: #171716;
      --quiet: #77736c;
      --blue: #3146dc;
      --card: #e7e3dd;
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }

    html {
      background: var(--paper);
      scroll-behavior: smooth;
    }

    body {
      font-family: Manrope, Arial, sans-serif;
      color: var(--ink);
      letter-spacing: -0.045em;
      overflow-x: hidden;
    }

    a, button {
      color: inherit;
      text-decoration: none;
      border: none;
      background: none;
      cursor: pointer;
      font: inherit;
    }

    ::selection {
      background: var(--blue);
      color: #fff;
    }

    :focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 4px;
    }

    .mono {
      font-family: "DM Mono", monospace;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 0.07em;
    }

    .wrap {
      width: min(1440px, 100%);
      margin: auto;
      padding: 0 34px;
    }

    /* Navigation */
    .nav {
      position: fixed;
      z-index: 50;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(243, 241, 237, 0.95);
      backdrop-filter: blur(10px);
    }

    .nav-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 25px;
      padding-bottom: 25px;
    }

    .brand {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .brand-first {
      margin-right: 0.22em;
    }

    .brand b {
      font-weight: 400;
      color: var(--blue);
    }

    .nav-links {
      display: flex;
      gap: 28px;
      font-size: 12px;
      align-items: center;
    }

    .nav-links a {
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--blue);
    }

    .nav-cta {
      border: 1px solid #bbb7b0;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 11px;
      transition: background 0.25s, color 0.25s;
    }

    .nav-links a.nav-cta:hover {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }

    .back-btn {
      font-size: 12px;
      color: var(--quiet);
      transition: color 0.2s;
    }

    .back-btn:hover {
      color: var(--blue);
    }

    /* Page Management */
    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    /* Hero */
    .hero {
      min-height: 100vh;
      padding: 190px 0 100px;
      background: var(--paper);
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .hero-kicker {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      font-family: "DM Mono", monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--quiet);
      margin-bottom: 18px;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 0s forwards;
    }

    .hero-label {
      color: var(--quiet);
      font-size: 12px;
      margin-bottom: 24px;
      font-weight: 500;
      letter-spacing: -0.02em;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 0.1s forwards;
    }

    .hero h1 {
      font-size: clamp(52px, 8vw, 96px);
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 0.94;
      padding-bottom: 0.06em;
      margin-bottom: 16px;
      overflow: visible;
      max-width: 900px;
    }

    .hero h1 span {
      display: inline-block;
      opacity: 0;
      animation: slideUp 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .hero h1 span:nth-child(1) { animation-delay: 0.15s; }
    .hero h1 span:nth-child(2) { animation-delay: 0.25s; }
    .hero h1 span:nth-child(3) { animation-delay: 0.35s; }

    /* "messy" -> settles into order, visualising the brief going from chaos to clarity.
       Only `transform` is animated here (never margin/width/letter-spacing) so the
       browser's line-wrapping is computed once and never reflows mid-animation. */
    #messyWord .chaos-letter {
      display: inline-block;
      transform: translate(var(--tx, 0px), var(--ty, 0px)) rotate(var(--rot, 0deg));
      transition: transform 0.72s cubic-bezier(0.34, 1.2, 0.64, 1);
    }

    .hero-tagline {
      font-size: clamp(18px, 2.5vw, 28px);
      font-weight: 400;
      letter-spacing: -0.05em;
      line-height: 1.35;
      color: #5f5b55;
      max-width: 700px;
      margin-bottom: 32px;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 0.5s forwards;
    }

    .hero-skills {
      font-size: 13px;
      color: var(--quiet);
      margin-bottom: 48px;
      letter-spacing: -0.02em;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 0.6s forwards;
    }

    .hero-cta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 0.7s forwards;
    }

    .hero-links {
      display: flex;
      gap: 22px;
      margin-top: 26px;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 0.85s forwards;
    }

    .hero-links a {
      font-size: 13px;
      color: var(--quiet);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      transition: color 0.2s, border-color 0.2s;
    }

    .hero-links a:hover {
      color: var(--blue);
      border-color: var(--blue);
    }

    /* Contact modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(23, 23, 22, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 24px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      background: var(--paper);
      border: 1px solid var(--ink);
      max-width: 420px;
      width: 100%;
      padding: 40px 32px;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      color: var(--quiet);
      transition: color 0.2s;
    }

    .modal-close:hover {
      color: var(--ink);
    }

    .modal-box h3 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .modal-box p.modal-sub {
      font-size: 13px;
      color: var(--quiet);
      margin-bottom: 24px;
    }

    .modal-field {
      margin-bottom: 16px;
    }

    .modal-field label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--quiet);
      margin-bottom: 6px;
    }

    .modal-field input,
    .modal-field textarea {
      width: 100%;
      border: 1px solid #bbb7b0;
      border-radius: 0;
      background: transparent;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 14px;
      color: var(--ink);
    }

    .modal-field textarea {
      resize: vertical;
      min-height: 90px;
    }

    .modal-field input:focus,
    .modal-field textarea:focus {
      outline: none;
      border-color: var(--blue);
    }

    .modal-box .button {
      width: 100%;
      margin-top: 4px;
    }

    .scroll-cue {
      position: absolute;
      bottom: 36px;
      left: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: "DM Mono", monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--quiet);
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 1.1s forwards;
    }

    @media (max-width: 768px) {
      .scroll-cue { display: none; }
    }

    @keyframes slideUp {
      0% {
        opacity: 0;
        transform: translateY(40px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 13px 20px;
      background: var(--ink);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.02em;
      transition: transform 0.2s, background 0.2s;
    }

    .button:hover {
      transform: translateY(-2px);
      background: var(--blue);
    }

    .button-secondary {
      background: transparent;
      border: 1px solid var(--ink);
      color: var(--ink);
    }

    .button-secondary:hover {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    /* Marquee */
    .marquee-section {
      overflow: hidden;
      background: var(--ink);
      color: var(--paper);
      padding: 40px 0;
      width: 100vw;
      margin: 40px calc(50% - 50vw) 0;
    }

    .marquee {
      display: flex;
      gap: 40px;
      animation: scroll 20s linear infinite;
      width: fit-content;
    }

    .marquee-item {
      font-size: 22px;
      font-weight: 600;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: 0.01em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .marquee-dot {
      font-size: 14px;
      opacity: 0.4;
      flex-shrink: 0;
    }


    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* Selected Work */
    .selected-work {
      padding-top: 100px;
      padding-bottom: 100px;
    }

    .section-title {
      font-size: clamp(36px, 6vw, 64px);
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 0.9;
      margin-bottom: 60px;
    }

    .cases-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 40px;
      margin-bottom: 40px;
    }

    @media (max-width: 700px) {
      .cases-grid {
        grid-template-columns: 1fr;
      }
    }

    .case-extra {
      display: none;
    }

    .show-more-wrap {
      text-align: center;
    }

    .case-card {
      cursor: pointer;
      transition: all 0.3s ease;
      perspective: 1000px;
    }

    .case-card-inner {
      position: relative;
      transition: transform 0.3s ease;
      transform-style: preserve-3d;
    }

    .case-card:hover .case-card-inner {
      transform: rotateX(0.5deg) rotateY(0.8deg);
    }

    .case-preview {
      background: var(--card);
      height: 320px;
      border-radius: 0;
      margin-bottom: 20px;
      overflow: hidden;
      position: relative;
    }

    .case-preview-img {
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      filter: saturate(0.78);
      transition: filter 0.4s, transform 0.4s;
    }

    .case-card:hover .case-preview-img {
      filter: saturate(1);
      transform: scale(1.01);
    }

    .case-overlay {
      position: absolute;
      inset: 0;
      background: rgba(23, 23, 22, 0);
      transition: background 0.4s;
      display: flex;
      align-items: flex-end;
      padding: 24px;
      opacity: 0;
      transition: opacity 0.4s;
    }

    .case-card:hover .case-overlay {
      opacity: 1;
      background: rgba(23, 23, 22, 0.3);
    }

    .case-overlay-text {
      color: #fff;
      font-size: 12px;
      font-family: "DM Mono", monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .case-overlay-role {
      color: rgba(255, 255, 255, 0.65);
      font-size: 11px;
      margin-top: 6px;
      letter-spacing: 0.01em;
    }

    .case-title {
      font-size: clamp(24px, 4vw, 40px);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 8px;
      color: var(--ink);
    }

    .case-meta {
      font-size: 12px;
      color: var(--quiet);
      font-family: "DM Mono", monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .case-status {
      display: inline-block;
      font-size: 10px;
      font-family: "DM Mono", monospace;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--blue);
      border: 1px solid var(--blue);
      padding: 3px 8px;
      margin-bottom: 12px;
    }

    .case-description {
      font-size: 14px;
      line-height: 1.5;
      color: #5f5b55;
      max-width: 500px;
    }

    /* Reveal on scroll */
    .case-card {
      opacity: 0;
      animation: fadeInUp 0.6s ease-out forwards;
    }

    .cases-grid .case-card:nth-child(1) { animation-delay: 0s; }
    .cases-grid .case-card:nth-child(2) { animation-delay: 0.15s; }
    .cases-grid .case-card:nth-child(3) { animation-delay: 0.3s; }
    .cases-grid .case-card:nth-child(4) { animation-delay: 0.45s; }

    /* What I Do */
    .what-i-do {
      padding: 100px 0;
      background: var(--card);
      margin-left: calc(-50vw + 50%);
      margin-right: calc(-50vw + 50%);
    }

    .capabilities-grid {
      display: block;
    }

    .skills-row {
      position: relative;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 32px;
      padding: 34px 0;
      border-bottom: 1px solid #d7d3cb;
      opacity: 0;
      animation: fadeInUp 0.6s ease-out forwards;
    }

    .skills-row:first-child { border-top: 1px solid #d7d3cb; }
    .skills-row:nth-child(1) { animation-delay: 0.15s; }
    .skills-row:nth-child(2) { animation-delay: 0.28s; }
    .skills-row:nth-child(3) { animation-delay: 0.41s; }

    .skills-row::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 1px;
      background: var(--blue);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .skills-row:hover::after {
      transform: scaleX(1);
    }

    .skills-row-left {
      display: flex;
      align-items: baseline;
      gap: 22px;
      min-width: 0;
    }

    .skills-idx {
      font-family: "DM Mono", monospace;
      font-size: 12px;
      color: var(--quiet);
      transition: color 0.3s;
      flex-shrink: 0;
    }

    .skills-row:hover .skills-idx {
      color: var(--blue);
    }

    .skills-name {
      font-size: clamp(24px, 3.4vw, 36px);
      font-weight: 600;
      letter-spacing: -0.02em;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      white-space: nowrap;
    }

    .skills-row:hover .skills-name {
      transform: translateX(10px);
      color: var(--blue);
    }

    .skills-tags {
      position: relative;
      z-index: 1;
      font-size: 12px;
      line-height: 1.7;
      color: var(--quiet);
      text-align: right;
      max-width: 320px;
      flex-shrink: 0;
    }

    @media (max-width: 768px) {
      .skills-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        padding: 26px 4px;
      }

      .skills-tags {
        text-align: left;
        max-width: 100%;
      }

      .skills-row:hover .skills-name {
        transform: none;
      }
    }

    /* About */
    .about {
      padding-top: 100px;
      padding-bottom: 100px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: start;
    }

    .about-image {
      width: 100%;
      max-width: 280px;
      height: 320px;
      background: var(--card);
      border-radius: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      animation: fadeInUp 0.6s ease-out 0.2s forwards;
    }

    .about-content {
      opacity: 0;
      animation: fadeInUp 0.6s ease-out 0.3s forwards;
    }

    .about-content h2 {
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 0.9;
      margin-bottom: 24px;
    }

    .about-content p {
      font-size: 14px;
      line-height: 1.65;
      color: #5f5b55;
      margin-bottom: 28px;
      max-width: 500px;
    }

    /* All Projects */
    /* Case Study Page */
    .case-study {
      padding-top: 100px;
    }

    .cs-hero {
      padding-top: 80px;
      padding-bottom: 60px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--quiet);
      margin-bottom: 32px;
      font-family: "DM Mono", monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      transition: color 0.2s, gap 0.2s;
    }

    .back-btn:hover {
      color: var(--blue);
      gap: 12px;
    }

    .cs-hero h1 {
      font-size: clamp(42px, 7vw, 80px);
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 0.85;
      margin-bottom: 24px;
    }

    .cs-intro {
      font-size: 16px;
      line-height: 1.6;
      color: #5f5b55;
      max-width: 700px;
    }

    .cs-image {
      width: 100%;
      height: 50vh;
      background: var(--card);
      border-radius: 0;
      background-size: cover;
      background-position: center;
      margin: 60px 0;
      box-shadow: 0 20px 60px rgba(23, 23, 22, 0.08);
    }

    .cs-details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 50px;
      padding-top: 60px;
      padding-bottom: 60px;
      border-top: 1px solid #c8c4bd;
      margin-bottom: 80px;
    }

    .cs-detail-label {
      font-size: 10px;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--quiet);
      margin-bottom: 12px;
      font-weight: 600;
    }

    .cs-detail-value {
      font-size: 15px;
      line-height: 1.5;
      color: var(--ink);
    }

    .cs-section {
      margin-bottom: 80px;
    }

    .cs-section h2 {
      font-size: clamp(28px, 4vw, 48px);
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 0.9;
      margin-bottom: 28px;
    }

    .cs-section p {
      font-size: 15px;
      line-height: 1.7;
      color: #5f5b55;
      max-width: 800px;
      margin-bottom: 20px;
    }

    .cs-section ul {
      list-style: none;
      padding: 0;
      font-size: 15px;
      line-height: 1.7;
      color: #5f5b55;
      max-width: 800px;
    }

    .cs-section li {
      margin-bottom: 12px;
      padding-left: 20px;
      position: relative;
    }

    .cs-section li:before {
      content: "→";
      position: absolute;
      left: 0;
      color: var(--blue);
    }

    .cs-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 40px;
    }

    /* Reusable pill/tag component — same border-radius language as the
       site's buttons, but outlined and non-interactive so it reads as
       metadata rather than a clickable CTA. */
    .tag {
      display: inline-flex;
      align-items: center;
      height: 32px;
      box-sizing: border-box;
      border: 1px solid #c8c4bd;
      border-radius: 999px;
      padding: 0 16px;
      font-family: "DM Mono", monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--quiet);
      background: transparent;
    }

    /* ===== Fitera dedicated case study ===== */
    .fit-section {
      padding-top: 72px;
      padding-bottom: 72px;
      border-top: 1px solid #e2ded5;
    }

    .fit-section:first-of-type { border-top: none; }

    .fit-kicker {
      font-family: "DM Mono", monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--blue);
      margin-bottom: 14px;
    }

    .fit-h2 {
      font-size: clamp(26px, 3.6vw, 40px);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 24px;
      max-width: 800px;
    }

    .fit-lede {
      font-size: 18px;
      line-height: 1.6;
      color: #5f5b55;
      max-width: 680px;
      margin-bottom: 32px;
    }

    .fit-lede.large {
      font-size: clamp(22px, 3vw, 30px);
      color: var(--ink);
      font-weight: 500;
      line-height: 1.35;
      max-width: 820px;
    }

    /* Hero */
    .fit-hero-top {

    .fit-stat-num {
      font-family: "DM Mono", monospace;

      margin-bottom: 4px;

      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin: 24px 0 32px;

      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.03em;

      border-radius: 999px;
      padding: 8px 16px;

      color: var(--quiet);
      font-size: 14px;
    }

    .fit-needs {
      list-style: none;
      margin: 0;
      padding: 0;

      left: 0;
      color: var(--blue);
    }

    .fit-two-col-grid {
      display: grid;

    .fit-col-card li {

      color: #4a463f;

    }

    .fit-col-connector {

    }

      .fit-col-connector { transform: rotate(90deg); }

    .fit-insight-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 32px;
      margin-top: 32px;
    }

    @media (max-width: 700px) {

    }

    .fit-insight-num {
      font-family: "DM Mono", monospace;
      font-size: 12px;
      color: var(--quiet);
      margin-bottom: 10px;
    }

    .fit-insight h4 {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    .fit-insight p {
      font-size: 14px;
      color: var(--quiet);
      line-height: 1.5;
    }

    .fit-decision-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 16px;
      align-items: center;
      padding: 18px 0;

    .fit-decision-row .arrow { color: var(--blue); font-size: 14px; }
    .fit-decision-row .response { font-size: 14px; font-weight: 600; color: var(--ink); }

    @media (max-width: 700px) {
      .fit-decision-row { grid-template-columns: 1fr; gap: 4px; }
      .fit-decision-row .arrow { display: none; }
    }

    .fit-ia-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      margin: 32px 0;
    }

    @media (max-width: 700px) {
      .fit-ia-cols { grid-template-columns: 1fr; }
    }

    .fit-ia-cols ol {
      list-style: none;
      margin: 0;
      padding: 0;
      counter-reset: ia;
    }

    .fit-ia-cols li {
      font-size: 14px;

      border-bottom: 1px solid #e2ded5;

    .fit-counter-card {

    .fit-round-grid {

    .fit-round-card {
      border: 1px solid #d7d3cb;

      background: rgba(255,255,255,.28);
    }

    .fit-round-num {
      font-family: "DM Mono", monospace;
      font-size: 11px;
      text-transform: uppercase;
      color: var(--quiet);
      margin-bottom: 12px;
    }

    .fit-round-card h4 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .fit-round-card p {
      font-size: 13px;
      color: var(--quiet);
      line-height: 1.5;
      margin: 0;
    }

    .fit-round-fix {
      font-size: 13px;
      font-weight: 600;
      color: var(--blue);
    }

    .fit-decision-stack { display:grid; gap:16px; }
    .fit-decision-stack > div { padding-top:14px; border-top:1px solid rgba(30,29,26,.1); }
    .fit-decision-stack > div:first-child { padding-top:0; border-top:0; }
    .fit-decision-stack span { display:block; margin-bottom:5px; color:var(--blue); font:10px/1.25 "DM Mono",monospace; letter-spacing:.06em; text-transform:uppercase; }
    .fit-decision-signal { padding:14px !important; border:1px solid rgba(49,70,220,.18) !important; background:rgba(49,70,220,.045); }
    .fit-decision-signal p { color:var(--ink); }

    .fit-visual-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    .fit-swatches {

      gap: 16px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .fit-swatch {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: "DM Mono", monospace;
      font-size: 11px;

    .fit-swatch-chip {

    .fit-mock-grid {

      grid-template-columns: repeat(4, 1fr);

      margin-top: 32px;
    }

    .mock-screen {
      aspect-ratio: 9 / 16;
      border: 1px solid #d7d3cb;

    }

    .mock-screen .m-status { height: 4px; width: 30%; background: #d7d3cb; margin-bottom: 4px; }
    .mock-screen .m-header { height: 16px; background: var(--card); }
    .mock-screen .m-card { height: 34px; background: var(--card); }

    .mock-screen .m-line { height: 5px; background: #e2ded5; }
    .mock-screen .m-line.w60 { width: 60%; }
    .mock-screen .m-fill { flex: 1; }

    /* Fitera screens reconstructed from the supplied app CSS. The internal
       layout uses a 390 px reference frame, so it keeps the original visual
       proportions when displayed in a portfolio tile. */
    .fitera-phone { position: relative; aspect-ratio: 390 / 844; overflow: hidden; background: #fff; color: #1a1f4b; container-type: size; font-family: Inter, sans-serif; }
    .fitera-phone * { box-sizing: border-box; }
    .fitera-phone .fp-top { display: flex; align-items: center; justify-content: space-between; height: 16cqh; padding: 6cqh 6cqw 2cqh; }
    .fitera-phone .fp-avatar, .fitera-phone .fp-icon { display: grid; place-items: center; flex: 0 0 auto; border-radius: 4.1cqw; }
    .fitera-phone .fp-avatar { width: 13.3cqw; height: 13.3cqw; background: #f9c0b9; color: #3b449b; font-size: 4.6cqw; font-weight: 700; }
    .fitera-phone .fp-hello { flex: 1; margin-left: 3cqw; font-size: 4.1cqw; font-weight: 500; color: #000; }
    .fitera-phone .fp-icon { width: 11.3cqw; height: 11.3cqw; background: rgba(249,192,185,.2); color: #3b449b; font-size: 5cqw; }
    .fitera-phone .fp-hero { margin: 2.1cqh 6.15cqw 0; padding: 4.2cqh 6.15cqw; border-radius: 6.15cqw; background: linear-gradient(180deg,#3b449b 0%,#2a3276 100%); color: #fff; box-shadow: 0 20px 25px -5px rgba(0,0,0,.1); }
    .fitera-phone .fp-date { margin: 0 0 1cqh; font-family: "Bebas Neue", sans-serif; font-size: 8.2cqw; line-height: .95; letter-spacing: .04em; text-transform: uppercase; }
    .fitera-phone .fp-sub { font-size: 3.6cqw; opacity: .8; }
    .fitera-phone .fp-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 3cqw; margin-top: 3.1cqh; }
    .fitera-phone .fp-stat { padding: 2.3cqh 2cqw; text-align: center; border: 1px solid rgba(255,255,255,.2); border-radius: 4.1cqw; background: rgba(255,255,255,.2); }
    .fitera-phone .fp-stat b { display: block; font-size: 6.1cqw; line-height: 1; }
    .fitera-phone .fp-stat span { display: block; margin-bottom: 1cqh; font-size: 3.1cqw; font-weight: 600; }
    .fitera-phone .fp-section { padding: 3.2cqh 6.15cqw 0; }
    .fitera-phone .fp-section-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.7cqh; color: #1a1f4b; font: 5.4cqw/1 "Bebas Neue", sans-serif; letter-spacing: .05em; text-transform: uppercase; }
    .fitera-phone .fp-link { color: #3b449b; font: 2.8cqw Inter, sans-serif; font-weight: 700; text-transform: none; }
    .fitera-phone .fp-request, .fitera-phone .fp-session { display: flex; gap: 2.5cqw; align-items: center; padding: 2.4cqw; border-radius: 4.1cqw; background: #fff; box-shadow: 0 8px 18px rgba(38,44,93,.08); }
    .fitera-phone .fp-initial { display: grid; place-items: center; width: 10.5cqw; height: 10.5cqw; border-radius: 50%; background: #ced1ec; color: #3b449b; font-size: 3.5cqw; font-weight: 700; }
    .fitera-phone .fp-card-name { font-size: 3.5cqw; font-weight: 700; color: #1a1f4b; }
    .fitera-phone .fp-card-copy { margin-top: .6cqh; color: #73779a; font-size: 2.9cqw; line-height: 1.25; }
    .fitera-phone .fp-actions { display: flex; gap: 1.5cqw; margin-left: auto; }
    .fitera-phone .fp-actions i { width: 6cqw; height: 6cqw; border-radius: 50%; background: #3b449b; color: #fff; display: grid; place-items: center; font-size: 3cqw; font-style: normal; }
    .fitera-phone .fp-actions i:first-child { background: #f9c0b9; color: #3b449b; }
    .fitera-phone .fp-client-list { display: grid; gap: 1.5cqh; }
    .fitera-phone .fp-client { display: flex; align-items: center; justify-content: space-between; padding: 2.2cqw; border-bottom: 1px solid rgba(59,68,155,.1); font-size: 3.3cqw; }
    .fitera-phone .fp-status { color: #3b449b; font-size: 2.7cqw; font-weight: 700; }
    .fitera-phone .fp-tabbar { position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-around; padding: 1.8cqh 5cqw 2.5cqh; border-radius: 7.2cqw 7.2cqw 0 0; background: rgba(255,255,255,.88); box-shadow: 0 -8px 25px rgba(59,68,155,.08); color: #8589a5; font-size: 3.5cqw; }
    .fitera-phone .fp-tabbar b { color: #3b449b; }
    .fitera-phone.fit-calendar { background: linear-gradient(180deg,#fff 0%,#f5f5fb 100%); }
    .fitera-phone .fp-calendar-head { padding: 7cqh 6.15cqw 2.2cqh; color: #1a1f4b; font: 8cqw/1 "Bebas Neue", sans-serif; letter-spacing: .05em; text-transform: uppercase; }
    .fitera-phone .fp-segment { display: flex; margin: 0 6.15cqw; padding: .7cqw; border-radius: 4.1cqw; background: #eceefa; }
    .fitera-phone .fp-segment span { flex: 1; padding: 1.7cqh 0; border-radius: 3.1cqw; text-align: center; font-size: 3.1cqw; color: #73779a; }
    .fitera-phone .fp-segment .active { background: #3b449b; color: #fff; font-weight: 700; }
    .fitera-phone .fp-week { display: grid; grid-template-columns: repeat(7,1fr); gap: .8cqw; padding: 3.2cqh 6.15cqw 2.5cqh; text-align: center; }

    .fitera-phone .fp-day.today b { display: grid; place-items: center; width: 7.2cqw; height: 7.2cqw; margin: .8cqh auto 0; border-radius: 50%; background: #f9c0b9; color: #3b449b; }
    .fitera-phone .fp-schedule { display: grid; gap: 1.5cqh; padding: 0 6.15cqw; }
    .fitera-phone .fp-session { border-left: 1.4cqw solid #3b449b; border-radius: 3.1cqw; }
    .fitera-phone .fp-session.pink { border-left-color: #f9c0b9; }
    .fitera-phone .fp-time { color: #3b449b; font-size: 3.2cqw; font-weight: 700; }
    .fitera-phone .fp-session div:last-child { color: #73779a; font-size: 2.8cqw; }
    .fitera-phone.fit-role { background: linear-gradient(180deg,#fff 0%,#ced1ec 100%); }
    .fitera-phone .fp-role-head { padding: 7cqh 6.15cqw 2.2cqh; text-align: center; color: #fff; text-shadow: 0 4px 8px rgba(0,0,0,.15); }
    .fitera-phone .fp-role-head h3 { margin: 0; font: 8cqw/1 "Bebas Neue", sans-serif; letter-spacing: .05em; text-transform: uppercase; }
    .fitera-phone .fp-role-head p { margin: 1.5cqh 0 0; font-size: 3.1cqw; }
    .fitera-phone .fp-role-card { margin: 2.2cqh 6.15cqw; padding: 3cqh 4cqw; border-radius: 6.15cqw; background: rgba(255,255,255,.9); box-shadow: 0 14px 32px rgba(59,68,155,.12); }
    .fitera-phone .fp-role-card b { color: #3b449b; font: 5.3cqw "Bebas Neue", sans-serif; letter-spacing: .04em; text-transform: uppercase; }
    .fitera-phone .fp-role-card p { margin: 1cqh 0 2cqh; color: #5e6280; font-size: 3cqw; line-height: 1.35; }
    .fitera-phone .fp-role-item { padding: .8cqh 0; color: #3b449b; font-size: 2.9cqw; font-weight: 600; }

    .mock-label {
      font-size: 12px;
      color: var(--quiet);
      margin-top: 10px;
      text-align: center;
    }

    /* Real Fitera onboarding screen, rebuilt from the actual Figma frame.
       Uses container query units (cqw/cqh) so it stays proportional to the
       real 390x844 frame no matter how small/large the grid tile renders. */
    .mock-onboarding {
      position: relative;
      width: 100%;
      aspect-ratio: 390 / 844;
      overflow: hidden;
      background: linear-gradient(180deg, #F9C0B9 0%, #3B449B 50%, #4A5BB5 100%);
      color: #fff;
      container-type: size;
      container-name: mo;
    }

    /* soft colour-bleed band ~60% down the frame, standing in for the
       blurred pill shapes behind the photo in the real design */
    .mock-onboarding .mo-blob {
      position: absolute;
      width: 33cqw;
      height: 3cqh;
      border-radius: 50%;
      background: #0C1350;
      opacity: 0.22;
      filter: blur(6cqw);
    }
    .mock-onboarding .mo-blob.b1 { left: 2cqw;  top: 61cqh; }
    .mock-onboarding .mo-blob.b2 { left: 18cqw; top: 60cqh; }
    .mock-onboarding .mo-blob.b3 { left: 29cqw; top: 63cqh; }
    .mock-onboarding .mo-blob.b4 { left: 40cqw; top: 60cqh; }
    .mock-onboarding .mo-blob.b5 { left: 61cqw; top: 61cqh; }
    .mock-onboarding .mo-shadow {
      position: absolute;
      left: 0; width: 100cqw;
      top: 60cqh; height: 7cqh;
      background: #161D5D;
      filter: blur(4cqw);
    }

    /* photo placeholder — the real frame uses a cut-out photo of a person
       here; standing in with an abstract silhouette until the real export
       is dropped in */
    .mock-onboarding .mo-photo {
      position: absolute;
      left: -22cqw;
      top: -18cqh;
      width: 144cqw;
      height: 119cqh;
    }
    .mock-onboarding .mo-photo svg { width: 100%; height: 100%; display: block; }

    .mock-onboarding .mo-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      text-align: center;
      padding: 6cqh 4.6cqw 5cqh;
      box-sizing: border-box;
    }

    .mock-onboarding .mo-heading,
    .mock-onboarding .mo-with {
      position: relative;
      font-family: "Bebas Neue", sans-serif;
      font-size: 12.3cqw;
      line-height: 0.62;
      letter-spacing: 0.01em;
      text-transform: uppercase;
    }

    .mock-onboarding .mo-heading { margin-bottom: 1.2cqh; }
    .mock-onboarding .mo-with {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5cqw;
      margin-bottom: 3.5cqh;
    }

    .mock-onboarding .mo-logo { height: 4cqh; width: auto; flex-shrink: 0; }

    .mock-onboarding .mo-text {
      position: relative;
      font-size: 4.1cqw;
      line-height: 1.4;
      opacity: 0.95;
      max-width: 78cqw;
      margin: 0 auto 4cqh;
    }

    .mock-onboarding .mo-btn-primary,
    .mock-onboarding .mo-btn-secondary {
      position: relative;
      width: 100%;
      font-weight: 600;
      font-size: 4.1cqw;
      border-radius: 999px;
      padding: 3.6cqh 0;
      box-sizing: border-box;

    .mock-onboarding .mo-btn-primary {
      background: #F9C0B9;
      color: #4A54B8;
    }

    .mock-onboarding .mo-btn-secondary {
      background: rgba(255, 255, 255, 0.3);
      border: 1.5px solid #C4C4C4;
      color: #fff;
    }

    .mock-onboarding .mo-footnote {
      position: relative;
      font-size: 3.1cqw;
      opacity: 0.85;
      max-width: 85cqw;
      margin-top: 0.5cqh;
    }

    /* Exact composition from the supplied onboarding frame: editorial copy at
       the top, photo layer through the middle, and two full-width actions at
       the bottom. Values are tied to the original 390 × 844 frame. */
    .mock-onboarding .mo-photo { left: -22cqw; top: -21cqh; width: 144cqw; height: 119cqh; }
    .mock-onboarding .mo-content { display: block; padding: 0; }
    .mock-onboarding .mo-heading { position: absolute; top: 7.1cqh; left: 0; width: 100%; margin: 0; font-size: 12.3cqw; }
    .mock-onboarding .mo-with { position: absolute; top: 11.4cqh; left: 0; width: 100%; margin: 0; gap: 4.1cqw; font-size: 12.3cqw; }
    .mock-onboarding .mo-logo { height: 4cqh; }
    .mock-onboarding .mo-text { position: absolute; top: 18.7cqh; left: 11.2cqw; width: 77.6cqw; max-width: none; margin: 0; font-size: 4.1cqw; line-height: 1; }
    .mock-onboarding .mo-actions { position: absolute; left: 6.15cqw; right: 6.15cqw; top: 73.7cqh; }
